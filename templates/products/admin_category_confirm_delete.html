{% extends 'base.html' %}

{% block title %}Delete Category - Admin Portal - BazaarMart{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-16 px-4">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 text-center">
        <div class="w-14 h-14 bg-rose-50 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
        </div>
        <h2 class="text-xl font-black text-gray-900 mb-2">Delete Category?</h2>
        <p class="text-xs text-gray-600 mb-6">
            Are you sure you want to remove category <span class="font-bold text-gray-900">"{{ category.name }}"</span>? Products in this category will become uncategorized.
        </p>

        <form method="POST" class="flex justify-center space-x-3">
            {% csrf_token %}
            <a href="{% url 'products:admin_category_list' %}"
               class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold rounded-xl transition">
                Cancel
            </a>
            <button type="submit"
                    class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl shadow-md transition">
                Confirm Delete
            </button>
        </form>
    </div>
</div>
{% endblock %}
