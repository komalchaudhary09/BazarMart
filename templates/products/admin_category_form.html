{% extends 'base.html' %}

{% block title %}{{ action }} Category - Admin Portal - BazaarMart{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto my-10 px-4">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
        
        <div class="border-b border-gray-100 pb-4 mb-6">
            <a href="{% url 'products:admin_category_list' %}" class="text-xs text-indigo-600 font-bold hover:underline">&larr; Back to Categories</a>
            <h1 class="text-2xl font-black text-gray-900 mt-1">{{ action }} Category</h1>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Category Name *</label>
                {{ form.name }}
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Description</label>
                {{ form.description }}
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Category Icon / Image</label>
                {{ form.image }}
            </div>

            <div class="pt-2">
                <label class="flex items-center space-x-2 text-xs font-bold text-gray-700 cursor-pointer">
                    {{ form.is_active }}
                    <span>Active in Navigation</span>
                </label>
            </div>

            <div class="flex justify-end space-x-3 pt-6 border-t border-gray-100">
                <a href="{% url 'products:admin_category_list' %}" class="px-5 py-2.5 text-xs font-bold text-gray-600 hover:text-gray-900 border rounded-xl">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition">
                    Save Category
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
