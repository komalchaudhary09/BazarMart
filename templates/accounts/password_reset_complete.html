{% extends 'base.html' %}

{% block title %}Password Reset Successful - BazaarMart{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 px-4 text-center">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
        <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-circle-check text-xl"></i>
        </div>
        <h2 class="text-xl font-black text-gray-900 mb-2">Password Changed Successfully!</h2>
        <p class="text-xs text-gray-600 mb-6">Your new password has been set. You can now log in to your account.</p>
        <a href="{% url 'accounts:login' %}" class="inline-block px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl transition">
            Proceed to Log In
        </a>
    </div>
</div>
{% endblock %}
