{% extends 'base.html' %}

{% block title %}Reset Password - BazaarMart{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 px-4">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-key text-xl"></i>
            </div>
            <h2 class="text-2xl font-black text-gray-900">Forgot Password</h2>
            <p class="text-xs text-gray-500 mt-1">Enter your registered email address and we'll send you instructions to reset your password.</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" name="email" required autofocus
                       class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                       placeholder="you@example.com">
            </div>

            <button type="submit"
                    class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition">
                Send Reset Link
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-100 text-center">
            <a href="{% url 'accounts:login' %}" class="text-xs font-semibold text-indigo-600 hover:underline">
                &larr; Back to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
