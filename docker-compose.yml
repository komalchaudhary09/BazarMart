version: '3.8'

services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 multivendor_core.wsgi:application
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True

volumes:
  media_volume:
